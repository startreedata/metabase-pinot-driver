name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Java 21 for Pinot
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Start Pinot
      run: |
        chmod +x scripts/start-pinot-quickstart.sh
        PINOT_VERSION="$(jq -er '.pinot' app_versions.json)"
        export PINOT_VERSION
        ./scripts/start-pinot-quickstart.sh

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache Clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Clone metabase if needed
      run: |
        echo "=== Checking metabase setup ==="
        if [ ! -d "metabase" ]; then
          echo "Metabase directory not found, cloning..."
          make clone_metabase_if_missing
        else
          echo "Metabase directory found"
        fi

    - name: Download packaged driver
      uses: actions/download-artifact@v8
      with:
        name: pinot-driver
        path: metabase/resources/modules

    - name: Run tests with coverage
      run: make test

    - name: Smoke test the packaged driver in supported Metabase runtimes
      run: |
        metabase_versions=$(jq -er '([.metabase] + (.metabase_compatibility // [])) | unique[]' app_versions.json)
        while IFS= read -r metabase_version; do
          mkdir -p "target/runtime/${metabase_version}"
          curl --fail --location --retry 3 \
            "https://downloads.metabase.com/${metabase_version}/metabase.jar" \
            --output "target/runtime/${metabase_version}/metabase.jar"
          python3 scripts/smoke-test.py \
            --driver-jar metabase/resources/modules/pinot.metabase-driver.jar \
            --metabase-jar "target/runtime/${metabase_version}/metabase.jar" \
            --metabase-version "${metabase_version}" \
            --output-dir "target/smoke/${metabase_version}"
        done <<< "$metabase_versions"

    - name: Upload test results and coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-and-coverage
        path: |
          drivers/pinot/target/coverage/
          drivers/pinot/target/test-results/
          metabase/test-results/
          metabase/coverage/
          target/smoke/
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: drivers/pinot/target/coverage/codecov.json
        directory: drivers/pinot/target/coverage/
        flags: pinot-driver
        name: pinot-driver-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Comment coverage report
      uses: actions/github-script@v9
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = 'drivers/pinot/target/coverage/codecov.json';
          
          if (fs.existsSync(path)) {
            const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
            const computePercent = (data) => {
              if (typeof data === 'number') return data;
              if (!data || typeof data.coverage !== 'object') return null;
              
              let covered = 0;
              let total = 0;
              
              for (const fileCoverage of Object.values(data.coverage)) {
                if (!fileCoverage) continue;
                const entries = Array.isArray(fileCoverage) ? fileCoverage : Object.values(fileCoverage);
                
                for (const v of entries) {
                  if (v === null || v === undefined) continue;
                  total += 1;
                  const hits = v === true ? 1 : v;
                  if (typeof hits === 'number' && hits > 0) {
                    covered += 1;
                  }
                }
              }
              
              return total ? (covered / total * 100) : null;
            };
            
            const percent = computePercent(coverage);
            const coveragePercent = percent !== null ? percent.toFixed(2) : 'N/A';
            
            const codecovUrl = `https://app.codecov.io/gh/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}?flags=pinot-driver`;
            const body = `## 📊 Test Coverage Report
            
            **Pinot Driver Coverage**: ${coveragePercent}%
            **Codecov**: ${codecovUrl}
            
            Coverage details have been uploaded to the artifacts for this build.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

  test-parameter-api:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache Clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Run existing tests on the other parameter API
      shell: bash
      run: |
        if [[ "$(jq -r '.metabase' app_versions.json)" == v0.58.* ]]; then
          parameter_api_target=v0.64.3
        else
          parameter_api_target=v0.58.37
        fi
        make metabase_version="$parameter_api_target" test

    - name: Upload parameter API coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: parameter-api-coverage
        path: drivers/pinot/target/coverage/
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: drivers/pinot/target/coverage/codecov.json
        directory: drivers/pinot/target/coverage/
        flags: pinot-driver
        name: pinot-driver-parameter-api-coverage
        fail_ci_if_error: false
        verbose: true

  lint:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Check release latest selection
      run: python3 -m unittest discover -s scripts -p 'test_release_latest.py'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Run linting
      run: |
        cd drivers/pinot
        clojure -M:clj-kondo

  build:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Set up Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577
    
    - name: Cache Clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-
    
    - name: Clone metabase if needed
      run: |
        echo "=== Checking metabase setup ==="
        if [ ! -d "metabase" ]; then
          echo "Metabase directory not found, cloning..."
          make clone_metabase_if_missing
        else
          echo "Metabase directory found"
        fi
    
    - name: Build driver
      run: |
        make driver

        echo "=== Checking if driver JAR was created ==="
        if [ -f "metabase/resources/modules/pinot.metabase-driver.jar" ]; then
          echo "✅ Driver JAR successfully created"
          echo "📦 JAR size: $(du -h metabase/resources/modules/pinot.metabase-driver.jar | cut -f1)"
        else
          echo "❌ Driver JAR not found"
          echo "=== Debugging: listing metabase/resources/modules/ ==="
          ls -la metabase/resources/modules/ || echo "Directory not found"
          exit 1
        fi
    
    - name: Verify driver JAR contents
      run: |
        echo "📋 JAR contents (first 10 files):"
        jar -tf metabase/resources/modules/pinot.metabase-driver.jar | head -10
        echo "📋 JAR size and details:"
        ls -la metabase/resources/modules/pinot.metabase-driver.jar
    
    - name: Run driver verification
      run: clojure verify_driver.clj

    - name: Upload packaged driver
      uses: actions/upload-artifact@v7
      with:
        name: pinot-driver
        path: metabase/resources/modules/pinot.metabase-driver.jar
        if-no-files-found: error

  security:
    # Secrets are not available for PRs from forks; only run when secrets can be read.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    # Allow a cold NVD bootstrap and indexing, but bound prolonged upstream retries.
    timeout-minutes: 240
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Restore NVD database
      id: nvd-cache
      uses: actions/cache/restore@v5
      with:
        path: drivers/pinot/target/nvd-data
        key: ${{ runner.os }}-nvd-v1-${{ hashFiles('drivers/pinot/deps.edn', 'drivers/pinot/nvd-clojure.edn', 'drivers/pinot/nvd_suppressions.xml', 'scripts/bootstrap-nvd.clj', '.github/workflows/ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-nvd-v1-${{ hashFiles('drivers/pinot/deps.edn', 'drivers/pinot/nvd-clojure.edn', 'drivers/pinot/nvd_suppressions.xml', 'scripts/bootstrap-nvd.clj', '.github/workflows/ci.yml') }}-

    - name: Bootstrap NVD on a cold cache
      shell: bash
      run: |
        cd drivers/pinot
        mkdir -p target
        tool_classpath=$(clojure -Spath -M:security-scan)
        java -cp "$tool_classpath" clojure.main ../../scripts/bootstrap-nvd.clj 2>&1 | tee target/nvd-bootstrap.log
        # The pinned engine can log per-CVE ingestion failures and still exit zero.
        if grep -q 'Failed to process CVE-' target/nvd-bootstrap.log; then
          echo "NVD bootstrap omitted CVE data; refusing to scan or cache an incomplete database"
          exit 1
        fi

    - name: Run security scan with a fresh NIST API delta
      shell: bash
      env:
        NVD_API_TOKEN: ${{ secrets.NVD_API_KEY }}
      run: |
        cd drivers/pinot
        scan_classpath=$(clojure -Spath -M:security-scan-cp)
        date -u +%s > target/nvd-api-started-at.txt
        clojure -J-Dnvd.api.key="$NVD_API_TOKEN" -M:security-scan nvd-clojure.edn "$scan_classpath" 2>&1 | tee target/nvd-api-scan.log
        if grep -q 'Failed to process CVE-' target/nvd-api-scan.log; then
          echo "NVD API update omitted CVE data; refusing to cache an incomplete database"
          exit 1
        fi
        python3 - <<'PY'
        import json
        from datetime import datetime, timezone
        from pathlib import Path

        report = json.loads(Path("target/nvd/dependency-check-report.json").read_text())
        sources = {item["name"]: item["timestamp"] for item in report["scanInfo"]["dataSource"]}
        def epoch(name):
            return int(datetime.fromisoformat(sources[name].replace("Z", "+00:00")).timestamp())
        started = int(Path("target/nvd-api-started-at.txt").read_text())
        boundary = int(Path("target/nvd-boundary.txt").read_text())
        now = int(datetime.now(timezone.utc).timestamp())
        if not (started <= epoch("NVD API Last Checked") <= now
                and boundary <= epoch("NVD API Last Modified") <= now):
            raise SystemExit("NVD report does not prove a fresh API delta from the bootstrap/cache boundary")
        print("Verified fresh NIST API update and completed dependency analysis")
        PY

    - name: Save updated NVD database
      if: success()
      uses: actions/cache/save@v5
      with:
        path: drivers/pinot/target/nvd-data
        key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

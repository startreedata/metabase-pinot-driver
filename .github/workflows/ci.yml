name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Start Pinot
      run: |
        chmod +x scripts/start-pinot-quickstart.sh
        ./scripts/start-pinot-quickstart.sh

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache Clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Clone metabase if needed
      run: |
        echo "=== Checking metabase setup ==="
        if [ ! -d "metabase" ]; then
          echo "Metabase directory not found, cloning..."
          make clone_metabase_if_missing
        else
          echo "Metabase directory found"
        fi

    - name: Build driver
      run: make driver

    - name: Run tests with coverage
      run: make test

    - name: Smoke test the packaged driver in pinned Metabase
      run: |
        mkdir -p target/runtime
        metabase_version=$(jq -r '.metabase' app_versions.json)
        curl --fail --location --retry 3 \
          "https://downloads.metabase.com/${metabase_version}/metabase.jar" \
          --output target/runtime/metabase.jar
        python3 scripts/smoke-test.py \
          --driver-jar metabase/resources/modules/pinot.metabase-driver.jar \
          --metabase-jar target/runtime/metabase.jar \
          --output-dir target/smoke

    - name: Upload test results and coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-and-coverage
        path: |
          drivers/pinot/target/coverage/
          drivers/pinot/target/test-results/
          metabase/test-results/
          metabase/coverage/
          target/smoke/
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: drivers/pinot/target/coverage/codecov.json
        directory: drivers/pinot/target/coverage/
        flags: pinot-driver
        name: pinot-driver-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Comment coverage report
      uses: actions/github-script@v9
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = 'drivers/pinot/target/coverage/codecov.json';
          
          if (fs.existsSync(path)) {
            const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
            const computePercent = (data) => {
              if (typeof data === 'number') return data;
              if (!data || typeof data.coverage !== 'object') return null;
              
              let covered = 0;
              let total = 0;
              
              for (const fileCoverage of Object.values(data.coverage)) {
                if (!fileCoverage) continue;
                const entries = Array.isArray(fileCoverage) ? fileCoverage : Object.values(fileCoverage);
                
                for (const v of entries) {
                  if (v === null || v === undefined) continue;
                  total += 1;
                  const hits = v === true ? 1 : v;
                  if (typeof hits === 'number' && hits > 0) {
                    covered += 1;
                  }
                }
              }
              
              return total ? (covered / total * 100) : null;
            };
            
            const percent = computePercent(coverage);
            const coveragePercent = percent !== null ? percent.toFixed(2) : 'N/A';
            
            const codecovUrl = `https://app.codecov.io/gh/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}?flags=pinot-driver`;
            const body = `## 📊 Test Coverage Report
            
            **Pinot Driver Coverage**: ${coveragePercent}%
            **Codecov**: ${codecovUrl}
            
            Coverage details have been uploaded to the artifacts for this build.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

  lint:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Run linting
      run: |
        cd drivers/pinot
        clojure -M:clj-kondo

  build:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Set up Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577
    
    - name: Cache Clojure dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-
    
    - name: Clone metabase if needed
      run: |
        echo "=== Checking metabase setup ==="
        if [ ! -d "metabase" ]; then
          echo "Metabase directory not found, cloning..."
          make clone_metabase_if_missing
        else
          echo "Metabase directory found"
        fi
    
    - name: Build driver
      run: |
        make driver

        echo "=== Checking if driver JAR was created ==="
        if [ -f "metabase/resources/modules/pinot.metabase-driver.jar" ]; then
          echo "✅ Driver JAR successfully created"
          echo "📦 JAR size: $(du -h metabase/resources/modules/pinot.metabase-driver.jar | cut -f1)"
        else
          echo "❌ Driver JAR not found"
          echo "=== Debugging: listing metabase/resources/modules/ ==="
          ls -la metabase/resources/modules/ || echo "Directory not found"
          exit 1
        fi
    
    - name: Verify driver JAR contents
      run: |
        echo "📋 JAR contents (first 10 files):"
        jar -tf metabase/resources/modules/pinot.metabase-driver.jar | head -10
        echo "📋 JAR size and details:"
        ls -la metabase/resources/modules/pinot.metabase-driver.jar
    
    - name: Run driver verification
      run: clojure verify_driver.clj

  security:
    # Secrets are not available for PRs from forks; only run when secrets can be read.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.3.1577

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.gitlibs
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Run security scan
      env:
        NVD_API_TOKEN: ${{ secrets.NVD_API_KEY }}
      run: |
        cd drivers/pinot
        clojure -J-Dnvd.api.key="$NVD_API_TOKEN" -M:security-scan nvd-clojure.edn $(clojure -Spath -M:security-scan-cp)
